[project]
name = "bluesky-feed-generator"
version = "0.1.0"
description = "A Bluesky custom feed generator adapted to uv and libsql"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "atproto==0.0.59",
    "peewee>=3.16.2",
    "Flask>=2.3.2",
    "python-dotenv>=1.0.0",
    "libsql>=0.0.3",
    "gunicorn>=20.1.0",
]

[project.scripts]
dev = "server.cli:run_dev"
prod = "server.cli:run_prod"
publish = "publish_feed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "publish_feed.py"]

